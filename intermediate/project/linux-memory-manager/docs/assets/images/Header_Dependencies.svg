<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="358px" preserveAspectRatio="none" style="width:495px;height:358px;background:#FFFFFF;" version="1.1" viewBox="0 0 495 358" width="495px" zoomAndPan="magnify"><defs/><g><!--entity A--><g id="elem_A"><rect fill="#E6F3FF" height="52.5938" rx="6" ry="6" style="stroke:#2F3B4A;stroke-width:0.5;" width="184" x="7" y="17"/><text fill="#000000" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="164" x="17" y="39.9951">memory_manager_api.h</text><text fill="#000000" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="84" x="17" y="56.292">(PUBLIC API)</text></g><!--entity B--><g id="elem_B"><rect fill="#E8F5E8" height="52.5938" rx="6" ry="6" style="stroke:#2F3B4A;stroke-width:0.5;" width="157" x="20.5" y="152"/><text fill="#000000" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="137" x="30.5" y="174.9951">memory_manager.h</text><text fill="#000000" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="77" x="30.5" y="191.292">(INTERNAL)</text></g><!--entity C--><g id="elem_C"><rect fill="#FFF3CD" height="52.5938" rx="6" ry="6" style="stroke:#2F3B4A;stroke-width:0.5;" width="167" x="15.5" y="287"/><text fill="#000000" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="70" x="25.5" y="309.9951">glthread.h</text><text fill="#000000" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="147" x="25.5" y="326.292">(DATA STRUCTURES)</text></g><g id="elem_GMN7"><path d="M226.5,12 L226.5,39.5 L191.4,43.5 L226.5,47.5 L226.5,75.1875 A6,6 0 0 0 232.5,81.1875 L463.5,81.1875 A6,6 0 0 0 469.5,75.1875 L469.5,16 L459.5,6 L232.5,6 A6,6 0 0 0 226.5,12 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M459.5,6 L459.5,13 A3,3 0 0 0 462.5,16 L469.5,16 L459.5,6 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="222" x="232.5" y="23.9951">User-facing header that defines:</text><text fill="#000000" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="183" x="232.5" y="40.292">&#8226; XCALLOC, XFREE macros</text><text fill="#000000" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="209" x="232.5" y="56.5889">&#8226; API for registering data types</text><text fill="#000000" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="185" x="232.5" y="72.8857">&#8226; Links to internal manager</text></g><g id="elem_GMN10"><path d="M212.5,147 L212.5,174.5 L177.57,178.5 L212.5,182.5 L212.5,210.1875 A6,6 0 0 0 218.5,216.1875 L431.5,216.1875 A6,6 0 0 0 437.5,210.1875 L437.5,151 L427.5,141 L218.5,141 A6,6 0 0 0 212.5,147 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M427.5,141 L427.5,148 A3,3 0 0 0 430.5,151 L437.5,151 L427.5,141 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="184" x="218.5" y="158.9951">Implements core internals:</text><text fill="#000000" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="179" x="218.5" y="175.292">&#8226; Page management logic</text><text fill="#000000" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="196" x="218.5" y="191.5889">&#8226; Block allocation &amp; merging</text><text fill="#000000" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="202" x="218.5" y="207.8857">&#8226; Uses GLThread for free lists</text></g><g id="elem_GMN13"><path d="M218,282 L218,309.5 L182.84,313.5 L218,317.5 L218,345.1875 A6,6 0 0 0 224,351.1875 L482,351.1875 A6,6 0 0 0 488,345.1875 L488,286 L478,276 L224,276 A6,6 0 0 0 218,282 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><pat